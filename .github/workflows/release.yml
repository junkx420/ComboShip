name: Release

# Cut a stable release from a v* tag (pushed on the main branch): runs the SAME reusable build
# pipelines as nightly (build.yml, build-linux.yml, build-macos.yml — no gate, this is
# already-merged code), then publishes a DRAFT GitHub Release with the packaged Windows ZIP, Linux
# AppImage and macOS DMG attached. macOS does not hold the release back: if its build fails, the
# draft is published without the DMG.
# Draft so you can review/edit notes before publishing. See docs/UPSTREAM_MERGES.md.

on:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    uses: ./.github/workflows/build.yml
    with:
      release_zip: true # the publish job below attaches this artifact as the Release asset

  linux:
    uses: ./.github/workflows/build-linux.yml

  macos:
    uses: ./.github/workflows/build-macos.yml

  publish:
    needs: [windows, linux, macos]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Download packaged ZIP
        uses: actions/download-artifact@v4
        with:
          name: ComboShip-package-zip
          path: dist

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: ComboShip-linux-appimage
          path: dist

      - name: Download macOS DMG
        if: needs.macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ComboShip-macos
          path: dist

      - name: Name the assets after the tag
        shell: bash
        run: |
          set -euo pipefail
          zip=$(ls dist/*.zip | head -1)
          mv "$zip" "dist/ComboShip-${GITHUB_REF_NAME}-windows.zip"
          appimage=$(ls dist/ComboShip-*-linux-x86_64.AppImage | head -1)
          mv "$appimage" "dist/ComboShip-${GITHUB_REF_NAME}-linux-x86_64.AppImage"
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if ((${#dmgs[@]})); then
            mv "${dmgs[0]}" "dist/ComboShip-${GITHUB_REF_NAME}-macos.dmg"
          fi

      # Fan fork (junkx420): publish directly as a pre-release (this job only runs once the Windows and
      # Linux builds succeeded), with a fork disclaimer instead of generated notes. Drop when upstreaming.
      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          fail_on_unmatched_files: false # the DMG is absent when the macOS build failed
          generate_release_notes: false
          body: |
            **Unofficial fan build. This is NOT an official ComboShip release.**
            All credit for ComboShip goes to [Varuuna](https://github.com/Varuuna) and the contributors of
            [ComboShip](https://github.com/Varuuna/ComboShip). This fork is not affiliated with ComboShip,
            HarbourMasters or 2 Ship 2 Harkinian, so please report problems with this build here, not upstream.

            Adds split-game Anchor co-op background sync and a live partner feed; see the README.
            Both co-op players need this build. You need your own Ocarina of Time and Majora's Mask ROMs.

            Downloads: Windows `.zip`, Linux `.AppImage` (`chmod +x` it, then run), macOS `.dmg` if that build succeeded.
          files: |
            dist/ComboShip-${{ github.ref_name }}-windows.zip
            dist/ComboShip-${{ github.ref_name }}-linux-x86_64.AppImage
            dist/ComboShip-${{ github.ref_name }}-macos.dmg
